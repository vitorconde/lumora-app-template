bundle:
  name: lumora-app-template

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "lumora-app-template"
      description: "Template corporativo de apps de dados da Lumora Distribuidora"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    # workspace:
    #   host: https://<seu-workspace>.cloud.databricks.com
    variables:
      sql_warehouse_id: "<id-do-sql-warehouse>"
